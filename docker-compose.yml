version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    volumes:
      - ./server/tom.db:/app/tom.db
    environment:
      - GIN_MODE=release

  tma:
    build: ./tma
    ports:
      - "8081:8081"
    volumes:
      - ./tma/tma.db:/app/tma.db
    env_file:
      - ./tma/.env
    depends_on:
      - server

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server
